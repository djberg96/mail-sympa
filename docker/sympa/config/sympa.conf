## Main Sympa configuration file

# Database configuration
db_type         pgsql
db_name         sympa
db_host         postgres
db_user         sympa
db_passwd       sympa_password
db_port         5432

# Domain configuration
domain          localhost
listmaster      postmaster@localhost
email           sympa@localhost
wwsympa_url     http://localhost/sympa

# Directories
home            /var/lib/sympa
etc             /etc/sympa
spool           /var/spool/sympa
log_dir         /var/log/sympa

# SOAP configuration
soap            on
soap_url        http://localhost/sympasoap

# Security
cookie_domain   localhost
cookie_expire   0
cookie_refresh  60

# Language
lang            en_US

# Logging
log_level       3
log_socket_type inet
syslog          facility_local1

# Mail
sendmail        /usr/sbin/sendmail
sendmail_aliases /etc/aliases

# Archive
default_archive_policy open
archive_default_index on

# Authentication
ldap_force_canonical_email off

# Create list policy
create_list     public_listmaster

# Web interface
title           Sympa Test Server
default_home    lists

# Processing
sleep           1

# Antivirus
antivirus_path  none

# Bounce management
bounce_delay    7d
bounce_score_spam 10

# Task manager
task_manager_pidfile /var/run/sympa/task_manager.pid
