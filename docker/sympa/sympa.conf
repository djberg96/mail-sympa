# Sympa configuration file
# Basic configuration for Docker development environment

# Domain settings
domain localhost
listmaster listmaster@localhost

# Database configuration
db_type PostgreSQL
db_name sympa
db_host postgres
db_user sympa
db_passwd sympa_password
db_port 5432

# Web interface
wwsympa_url http://localhost:8080/sympa

# SOAP interface
soap_url http://localhost:8080/sympasoap

# Email settings
sendmail /usr/sbin/sendmail
sendmail_aliases /etc/mail/sympa_aliases

# Logging
log_level 2
log_socket_type unix

# Language
lang en_US

# Host and user
host localhost
email listmaster@localhost

# Security
cookie_domain localhost
session_table_ttl 3600

# SOAP settings
soap_url http://localhost:8080/sympasoap

# Trusted applications for SOAP
trusted_applications trusted_apps.conf
