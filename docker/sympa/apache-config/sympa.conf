<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /usr/share/sympa/static_content

    # FastCGI configuration for Sympa web interface
    ScriptAlias /sympa /usr/lib/cgi-bin/sympa/wwsympa.fcgi

    # SOAP interface
    ScriptAlias /sympasoap /usr/lib/cgi-bin/sympa/sympasoap.fcgi

    <Directory "/usr/lib/cgi-bin/sympa">
        SetHandler fcgid-script
        Options +ExecCGI
        Require all granted
    </Directory>

    # Static content
    Alias /static-sympa /usr/share/sympa/static_content
    <Directory "/usr/share/sympa/static_content">
        Require all granted
    </Directory>

    # CSS and icons
    Alias /css-sympa /usr/share/sympa/static_content/css
    Alias /icons-sympa /usr/share/sympa/static_content/icons

    # Error and access logs
    ErrorLog /var/log/apache2/sympa_error.log
    CustomLog /var/log/apache2/sympa_access.log combined

    # Environment variables for Sympa
    SetEnv SYMPA_DOMAIN localhost
    SetEnv SYMPA_CONFIG /etc/sympa/sympa.conf
</VirtualHost>
