# WWSympa configuration file
# Web interface configuration for Sympa

# Basic settings
title Sympa Development Server
host localhost
http_host localhost:8080

# Database (same as main sympa.conf)
db_type PostgreSQL
db_name sympa
db_host postgres
db_user sympa
db_passwd sympa_password

# Web paths
static_content_path /var/lib/sympa/static_content
css_path /var/lib/sympa/static_content/css
pictures_path /var/lib/sympa/static_content/pictures

# Authentication
authentication_info_url http://localhost:8080/sympa/help/user
user_data_source include2

# Language
lang en_US
supported_lang en_US

# Cookie settings
cookie_domain localhost
cookie_expire 0
cookie_http_only on

# SOAP
soap_url http://localhost:8080/sympasoap

# Logging
log_level 2
