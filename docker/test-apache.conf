ServerRoot /etc/apache2
ServerName localhost
PidFile /tmp/mail-sympa-apache.pid
DefaultRuntimeDir /var/run/apache2
Listen 127.0.0.1:8080

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule fcgid_module /usr/lib/apache2/modules/mod_fcgid.so

User sympa
Group sympa
ErrorLog /proc/self/fd/2
LogLevel warn
FcgidIPCDir /tmp/mail-sympa-fcgid

ScriptAlias /sympasoap /usr/lib/cgi-bin/sympa/sympa_soap_server.fcgi
ScriptAlias /sympa /usr/lib/cgi-bin/sympa/wwsympa.fcgi
<Directory /usr/lib/cgi-bin/sympa>
    Options +ExecCGI
    SetHandler fcgid-script
    Require all granted
</Directory>
