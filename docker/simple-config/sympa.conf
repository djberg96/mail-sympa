# Test configuration for Ruby mail-sympa library

# Database settings - these will be overridden by environment variables
db_type         PostgreSQL
db_name         sympa
db_host         postgres
db_user         sympa
db_passwd       sympa123

# SOAP interface - this is critical for the Ruby library
soap            on

# Domain settings
domain          localhost
listmaster      postmaster@localhost

# Allow list creation for testing
create_list     public_listmaster

# Simplified authentication for testing
user_table      none

# Logging
log_level       3
